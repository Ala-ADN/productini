<div class="dashboard-container">
    <header class="dashboard-header">
        <div class="user-welcome">
            <span class="avatar">👤</span>
            <div>
                <h1>{{ greeting }}, User</h1>
                <p class="date">{{ getTodayDate() }}</p>
            </div>
        </div>
        <div class="settings-icon">⚙️</div>
    </header>

    <div class="quote-card">
        <p class="quote-text">"{{ quote.text }}"</p>
        <p class="quote-author">— {{ quote.author }}</p>
    </div>

    <h2 class="section-title">Your Apps</h2>

    <div class="apps-grid">
        @for (app of apps; track app.id) {
        <div class="app-card" [class.disabled]="!app.link" [routerLink]="app.link" tabindex="0">
            <div class="app-icon-box" [style.background]="app.color">
                {{ app.icon }}
            </div>
            <div class="app-info">
                <h3>{{ app.name }}</h3>
                <p>{{ app.desc }}</p>
            </div>
            <div class="arrow-icon">→</div>
        </div>
        }
    </div>

    <div class="widgets-row">
        <!-- Placeholders for future widgets -->
        <div class="widget">
            <h3>Weekly Progress</h3>
            <div class="chart-placeholder">
                <div class="bar" style="height: 60%"></div>
                <div class="bar" style="height: 40%"></div>
                <div class="bar" style="height: 80%"></div>
                <div class="bar" style="height: 50%"></div>
                <div class="bar" style="height: 90%"></div>
                <div class="bar" style="height: 30%"></div>
                <div class="bar" style="height: 70%"></div>
            </div>
        </div>
    </div>
</div>
