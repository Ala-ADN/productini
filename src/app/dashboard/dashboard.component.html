<div class="dashboard-container">
  <header class="dashboard-header">
    <div class="user-welcome">
      <span class="avatar">👤</span>
      <div>
        <h1>{{ greeting }}, User</h1>
        <p class="date">{{ getTodayDate() }}</p>
      </div>
    </div>
    <div class="settings-icon">⚙️</div>
  </header>

  <div class="quote-card">
    <p class="quote-text">"{{ quote.text }}"</p>
    <p class="quote-author">— {{ quote.author }}</p>
  </div>

  <h2 class="section-title">Your Apps</h2>

  <div class="apps-grid">
    @for (app of apps; track app.id) {
      <div class="app-card" [class.disabled]="!app.link" [routerLink]="app.link" tabindex="0">
        <div class="app-icon-box" [style.background]="app.color">
          {{ app.icon }}
        </div>
        <div class="app-info">
          <h3>{{ app.name }}</h3>
          <p>{{ app.desc }}</p>
        </div>
        <div class="arrow-icon">→</div>
      </div>
    }
  </div>

  <div class="widgets-row">
    <!-- Focus Time Stats Widget -->
    <div class="widget focus-stats-widget">
      <app-pomodoro-stats></app-pomodoro-stats>
    </div>
  </div>

  <!-- Floating Timer Widget -->
  <app-floating-timer></app-floating-timer>
</div>
