<div class="progress-widget">
  <div class="widget-header">
    <h3>Progress Indicator</h3>
  </div>
  
  <div class="widget-content">
    <!-- Percentage Display -->
    <div class="percentage-display">
      <span class="percentage-value">{{ progressValue }}%</span>
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar-container">
      <div class="progress-bar-fill" [style.width.%]="progressValue"></div>
    </div>

    <!-- Slider Control -->
    <div class="slider-container">
      <input 
        type="range" 
        min="0" 
        max="100" 
        [value]="progressValue"
        (input)="onSliderChange($event)"
        class="slider"
        aria-label="Progress percentage slider"
      />
    </div>

    <!-- Labels -->
    <div class="slider-labels">
      <span>0%</span>
      <span>50%</span>
      <span>100%</span>
    </div>
  </div>
</div>
